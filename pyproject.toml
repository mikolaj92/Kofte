[project]
name = "kofte"
version = "0.1.0"
description = "Open cultural style-translation layer: rewrite a message's language and/or register (Polish directness → Norwegian Janteloven is the shipped example)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Kofte contributors" }
]
keywords = ["style", "translation", "culture", "janteloven", "llm", "register"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
kofte = "kofte.cli:main"

[project.urls]
Homepage = "https://github.com/mikolaj92/Kofte"
Repository = "https://github.com/mikolaj92/Kofte"
Issues = "https://github.com/mikolaj92/Kofte/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kofte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
